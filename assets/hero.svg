<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="PUTRA animated banner">
  <defs>
    <radialGradient id="vign" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="0.5" stop-color="#aeb6c2"/>
      <stop offset="1" stop-color="#7c8492"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#vign)"/>

  <!-- =================================================================
       Staggered reveal: eyes (0.2s) -> PUTRA (1.0s) -> shuriken (1.8s)
       Each enters with fade + slide-up (ease-out). Idle loops start at
       2.6s, after every element is on screen. Outer <g> = entrance
       (opacity+translate, freeze); inner <g> = continuous idle.
  ================================================================== -->

  <!-- ===== 1. EYES ===== -->
  <g opacity="0">
    <animate attributeName="opacity" begin="0.2s" dur="0.6s" values="0;1" fill="freeze"
      calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" begin="0.2s" dur="0.6s"
      values="0 24; 0 0" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>

    <!-- left eye -->
    <ellipse cx="150" cy="150" rx="60" ry="42" fill="#f5f7fa"/>
    <ellipse cx="150" cy="150" rx="60" ry="42" fill="none" stroke="#cdd3db" stroke-width="2"/>
    <g>
      <circle cx="150" cy="150" r="21" fill="#10141c"/>
      <circle cx="143" cy="143" r="6" fill="#ffffff" opacity="0.85"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" begin="2.6s"
        values="-26 0; -26 0; 26 0; 26 0; -26 0" keyTimes="0; 0.4; 0.5; 0.9; 1"
        dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" begin="2.6s"
        values="1; 1; 0.1; 1; 1; 0.1; 1" keyTimes="0; 0.38; 0.45; 0.52; 0.88; 0.95; 1"
        dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- right eye -->
    <ellipse cx="300" cy="150" rx="60" ry="42" fill="#f5f7fa"/>
    <ellipse cx="300" cy="150" rx="60" ry="42" fill="none" stroke="#cdd3db" stroke-width="2"/>
    <g>
      <circle cx="300" cy="150" r="21" fill="#10141c"/>
      <circle cx="293" cy="143" r="6" fill="#ffffff" opacity="0.85"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" begin="2.6s"
        values="-26 0; -26 0; 26 0; 26 0; -26 0" keyTimes="0; 0.4; 0.5; 0.9; 1"
        dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" begin="2.6s"
        values="1; 1; 0.1; 1; 1; 0.1; 1" keyTimes="0; 0.38; 0.45; 0.52; 0.88; 0.95; 1"
        dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ===== 2. TEXT "PUTRA" ===== -->
  <g transform="translate(560,150)" opacity="0">
    <animate attributeName="opacity" begin="1.0s" dur="0.6s" values="0;1" fill="freeze"
      calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" begin="1.0s" dur="0.6s"
      values="0 24; 0 0" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <g>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800"
        fill="#ffffff" letter-spacing="4">PUTRA</text>
      <animateTransform attributeName="transform" type="scale" begin="2.6s"
        values="1; 1.16; 1" keyTimes="0; 0.5; 1" dur="1.8s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
    </g>
  </g>

  <!-- ===== 3. SHURIKEN ===== -->
  <g transform="translate(855,150)" opacity="0">
    <animate attributeName="opacity" begin="1.8s" dur="0.6s" values="0;1" fill="freeze"
      calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <animateTransform attributeName="transform" type="translate" additive="sum" begin="1.8s" dur="0.6s"
      values="0 24; 0 0" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" additive="sum" begin="2.6s"
        from="0" to="360" dur="2.6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" additive="sum" begin="2.6s"
          values="0.78; 1.12; 0.78" keyTimes="0; 0.5; 1" dur="2s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.45 0 0.2 1; 0.45 0 0.2 1"/>
        <path d="M48 0 L11 11 L0 48 L-11 11 L-48 0 L-11 -11 L0 -48 L11 -11 Z" fill="url(#steel)"/>
        <path d="M48 0 L11 11 L0 48 L-11 11 L-48 0 L-11 -11 L0 -48 L11 -11 Z"
          fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="0" cy="0" r="8" fill="#10141c"/>
        <circle cx="0" cy="0" r="8" fill="none" stroke="#9aa3b2" stroke-width="2"/>
      </g>
    </g>
  </g>
</svg>

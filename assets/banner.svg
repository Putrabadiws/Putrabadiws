<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Putra Abadi - Fullstack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/>
    <circle cx="60" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="180" cy="120" r="2"/>
    <circle cx="1140" cy="260" r="2"/><circle cx="1080" cy="260" r="2"/><circle cx="1020" cy="260" r="2"/>
    <circle cx="1140" cy="200" r="2"/><circle cx="1080" cy="200" r="2"/><circle cx="1020" cy="200" r="2"/>
  </g>

  <!-- accent bar -->
  <rect x="80" y="118" width="6" height="84" rx="3" fill="url(#accent)" filter="url(#glow)"/>

  <!-- name -->
  <text x="112" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#f0f6fc">Putra Abadi</text>

  <!-- subtitle -->
  <text x="114" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#9ca3af">Fullstack Developer &#160;•&#160; IT Enthusiast &#160;•&#160; Product Builder</text>

  <!-- tagline -->
  <text x="114" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#6b7280">I build the systems that collect the data — and the visuals that make it speak.</text>

  <!-- tech chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="114" y="262" width="92" height="30" rx="15" fill="#1f2937" stroke="#374151"/>
    <text x="160" y="282" text-anchor="middle" fill="#e5e7eb">Next.js</text>
    <rect x="216" y="262" width="92" height="30" rx="15" fill="#1f2937" stroke="#374151"/>
    <text x="262" y="282" text-anchor="middle" fill="#e5e7eb">Laravel</text>
    <rect x="318" y="262" width="92" height="30" rx="15" fill="#1f2937" stroke="#374151"/>
    <text x="364" y="282" text-anchor="middle" fill="#e5e7eb">Python</text>
    <rect x="420" y="262" width="92" height="30" rx="15" fill="#1f2937" stroke="#374151"/>
    <text x="466" y="282" text-anchor="middle" fill="#e5e7eb">Docker</text>
    <rect x="522" y="262" width="84" height="30" rx="15" fill="#1f2937" stroke="#374151"/>
    <text x="564" y="282" text-anchor="middle" fill="#e5e7eb">MySQL</text>
  </g>

  <!-- decorative angle bracket motif -->
  <g stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <polyline points="980,110 930,160 980,210"/>
    <polyline points="1080,110 1130,160 1080,210"/>
    <line x1="1040" y1="100" x2="1015" y2="220"/>
  </g>
</svg>
